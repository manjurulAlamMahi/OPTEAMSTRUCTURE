<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alternative Structure · Alternative · Operations Team</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="version-bar">
    <nav class="version-switch" aria-label="Version">
      <a href="index.html">My Idea</a>
      <a href="alt-structure.html" class="active" aria-current="true">Alternative</a>
    </nav>
    <span class="version-note">Based on the current situation</span>
  </div>

  <header class="page-header">
    <div>
      <h1>Alternative Structure</h1>
      <p class="hint">The team structure based on the current situation.</p>
    </div>
    <nav class="top-nav" aria-label="Main">
      <ul>
        <li><a href="alt-structure.html" class="active" aria-current="page">Alternative Structure</a></li>
        <li><a href="alt-suggestions.html">My Suggestion</a></li>
        <li><a href="alt-workflow.html">Work Flow</a></li>
        <li><a href="alt-faq.html">FAQ's</a></li>
      </ul>
    </nav>
  </header>

  <main class="chart-scroll">
    <div class="alt-chart" id="alt-chart">
      <svg class="lines" id="alt-lines" aria-hidden="true"></svg>

      <!-- Level 1 -->
      <div class="anode anode--top" data-id="top" style="grid-area: top">
        <span class="node-abbr">GM</span>
        <span class="node-title">General Manager</span>
      </div>

      <!-- Level 2 -->
      <div class="anode anode--om" data-id="om-1" style="grid-area: om1">
        <span class="node-abbr">OM</span>
        <span class="node-title">Operations Manager 1</span>
      </div>
      <div class="anode anode--om" data-id="om-2" style="grid-area: om2">
        <span class="node-abbr">OM</span>
        <span class="node-title">Operations Manager 2</span>
      </div>

      <!-- Level 3 (one lead box per team) and the team tables are added by alt-script.js -->
    </div>

    <ul class="alt-legend" id="alt-legend"></ul>
  </main>

  <script src="alt-data.js"></script>
  <script src="alt-script.js"></script>
</body>

</html>
